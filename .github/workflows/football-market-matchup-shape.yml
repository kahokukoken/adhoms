name: ADHOMS Football Market Matchup Shape
on:
  push:
    paths:
      - 'research/football/event_engine_market_matchup_shape.py'
      - 'research/football/event_engine.py'
      - '.github/workflows/football-market-matchup-shape.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy pandas requests scikit-learn
      - run: PYTHONPATH=research/football python research/football/event_engine_market_matchup_shape.py
      - run: cat research/football/output/event_engine_market_matchup_shape.json
      - uses: actions/upload-artifact@v4
        with:
          name: adhoms-football-market-matchup-shape
          path: research/football/output/event_engine_market_matchup_shape.json
          if-no-files-found: error
          retention-days: 30
