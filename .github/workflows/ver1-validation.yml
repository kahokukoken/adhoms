name: Ver1 Validation

on:
  push:
    branches: [ver1-production]
  pull_request:
    branches: [ver1-production]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:e2e

      - name: Validate 100 seeded runs
        run: npm run validate:100
