name: Phase 2 Core QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulation unit tests
        run: node --test tests/sim/*.test.js
