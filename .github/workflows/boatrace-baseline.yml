name: BOAT RACE frozen annual baseline
on:
  push:
    branches: ['research/boatrace-readiness-20260919']
    paths:
      - 'research/boatrace/baseline.py'
      - 'research/boatrace/run_baseline.py'
      - 'research/boatrace/test_*.py'
      - '.github/workflows/boatrace-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: boatrace-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    # Avoid restarting a long acquisition for each documentation/test commit.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[boat-annual]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no network, synthetic correctness fixtures)
        run: python -m unittest discover -s research/boatrace -p 'test_*.py' -v
      - name: Install archive decoder
        run: python -m pip install lhafile==0.3.1
      - name: Recover public-data archives from interrupted first run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: boatrace-baseline-35409472561
          run-id: 35409472561
          github-token: ${{ github.token }}
          path: research/boatrace/output/
      - name: Record recovery provenance limitations
        run: |
          echo 'Seed archives: run 35409472561, artifact 10574141912.'
          echo 'Cached-file timestamps below are read/replay times, NOT authenticated publication or original retrieval times.'
          echo 'No pre-close odds, execution, or profit claim is established by this run.'
      - name: Execute frozen baseline and provenance audit
        run: python research/boatrace/run_baseline.py --start 2025-09-01 --end 2026-08-31
      - name: Retain reproducibility bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-baseline-${{ github.run_id }}
          path: research/boatrace/output/
          retention-days: 30
          if-no-files-found: warn
