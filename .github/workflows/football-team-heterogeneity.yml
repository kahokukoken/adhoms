name: ADHOMS Football Team Heterogeneity
on:
  push:
    paths:
      - 'research/football/event_engine_heterogeneity.py'
      - 'research/football/event_engine.py'
      - '.github/workflows/football-team-heterogeneity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=research/football python research/football/event_engine_heterogeneity.py
      - run: cat research/football/output/event_engine_heterogeneity_sensitivity.json
      - uses: actions/upload-artifact@v4
        with:
          name: adhoms-football-team-heterogeneity
          path: research/football/output/event_engine_heterogeneity_sensitivity.json
          if-no-files-found: error
          retention-days: 30
