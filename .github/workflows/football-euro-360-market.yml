name: ADHOMS Football Euro 360 Market Replication

on:
  push:
    paths:
      - 'research/football/euro_360_market_replication.py'
      - '.github/workflows/football-euro-360-market.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests scikit-learn
      - name: Run Euro 2020/2024 replication
        run: python research/football/euro_360_market_replication.py
      - name: Show summary
        run: cat research/football/output/euro_360_market_replication.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: adhoms-football-euro-360-market
          path: research/football/output/euro_360_market_replication.json
          if-no-files-found: error
          retention-days: 30
