name: X connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/x-connection-check.yml']
permissions:
  contents: read
concurrency:
  group: x-connection-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signing and failure handling without credentials
        run: node --test tests/x-connection.test.mjs
      - name: Verify X account (no posting)
        run: node scripts/x-connection.mjs
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
