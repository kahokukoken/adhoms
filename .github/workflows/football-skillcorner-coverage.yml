name: ADHOMS Football SkillCorner Coverage

on:
  push:
    paths:
      - 'research/football/skillcorner_coverage.py'
      - '.github/workflows/football-skillcorner-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Audit SkillCorner coverage
        run: python research/football/skillcorner_coverage.py
      - name: Show summary
        run: cat research/football/output/skillcorner_coverage.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: adhoms-football-skillcorner-coverage
          path: research/football/output/skillcorner_coverage.json
          if-no-files-found: error
          retention-days: 30
