name: Ver1 QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Assemble Ver1 scripts
        run: node scripts/apply-enhancements.mjs

      - name: Build standalone Ver1
        env:
          ADHOMS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/build-standalone.mjs

      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/adhoms-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/adhoms-http.log
          exit 1

      - name: Run browser QA
        run: npm run test:e2e

      - name: Upload standalone Ver1
        uses: actions/upload-artifact@v4
        with:
          name: adhoms-ver1-review
          path: dist/
          retention-days: 7

      - name: Upload visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhoms-ver1-qa-evidence
          path: test-results/
          retention-days: 7
