name: ADHOMS Football SkillCorner Tracking Probe

on:
  push:
    paths:
      - '.github/workflows/football-skillcorner-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ADHOMS
        uses: actions/checkout@v4
      - name: Install Git LFS
        run: git lfs install
      - name: Fetch one SkillCorner tracking match only
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth=1 --filter=blob:none --sparse https://github.com/SkillCorner/opendata.git /tmp/skillcorner
          cd /tmp/skillcorner
          git sparse-checkout set data/matches/2017461
          git checkout
          git lfs pull --include='data/matches/2017461/2017461_tracking_extrapolated.jsonl'
          ls -lh data/matches/2017461/
      - name: Inspect schemas
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          base=Path('/tmp/skillcorner/data/matches/2017461')
          t=base/'2017461_tracking_extrapolated.jsonl'
          first=None
          with t.open(encoding='utf-8') as f:
              for line in f:
                  obj=json.loads(line)
                  if obj.get('timestamp') is not None and obj.get('player_data'):
                      first=obj; break
          print('TRACKING_KEYS', sorted(first.keys()))
          print('TRACKING_FRAME_SAMPLE', json.dumps(first)[:5000])
          print('PLAYER_KEYS', sorted(first['player_data'][0].keys()))
          m=json.loads((base/'2017461_match.json').read_text(encoding='utf-8'))
          print('MATCH_KEYS', sorted(m.keys()))
          print('HOME', m.get('home_team'))
          print('AWAY', m.get('away_team'))
          d=base/'2017461_dynamic_events.csv'
          with d.open(encoding='utf-8-sig',newline='') as f:
              r=csv.reader(f); print('DYNAMIC_COLUMNS', next(r))
          p=base/'2017461_phases_of_play.csv'
          with p.open(encoding='utf-8-sig',newline='') as f:
              r=csv.reader(f); print('PHASE_COLUMNS', next(r))
          PY
