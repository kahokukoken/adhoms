name: Publish approved X post
on:
  push:
    branches: [main]
    paths: ['social/requests/*.json']
permissions:
  contents: write
concurrency:
  group: x-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kahokukoken/adhoms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify publication safeguards
        run: node --test tests/x-publish.test.mjs tests/x-connection.test.mjs tests/social-queue.test.mjs
      - name: Publish exactly one approved request
        run: node scripts/x-publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
