function cardHTML(p,depth=0){const like=S.likes[p.id],book=S.books[p.id],follow=S.follow[p.who];return `<div class="card ${p.cat} ${depth?'reply depth'+Math.min(depth,2):''}" data-id="${p.id}"><div class="head"><div class="mark">${p.mark}</div><div><div class="who">${p.who}${p.internal?'<span class="internal">内部</span>':''}${p.m===monthIndex()&&p.w===S.week?'<span class="newtag">NEW</span>':''}</div><div class="meta">${p.meta} ・ ${catLabel(p.cat)}</div></div></div>${depth?'<div class="replyto">↳ 関連投稿への返信</div>':''}<div class="post">${p.text}</div>${relCount(p.topic)>0?`<div class="rel">↔ 同テーマの関連観測 ${relCount(p.topic)}件</div>`:''}<div class="acts"><button class="a ${like?'on':''}" onclick="act('${p.id}','like')">♡ 気になる</button><button class="a bm ${book?'on':''}" onclick="act('${p.id}','book')">🔖 調査</button><button class="a fl ${follow?'on':''}" onclick="act('${p.id}','follow')">＋ フォロー</button><button class="a" onclick="act('${p.id}','detail')">⌕ 詳細</button></div></div>`}
function renderFeed(){const e=document.getElementById('feedList');e.innerHTML='';let arr=currentPosts().filter(p=>S.filter==='ALL'||p.cat===S.filter); const groups=new Map();arr.forEach(p=>{let key=p.m; if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});[...groups.keys()].sort((a,b)=>b-a).forEach(m=>{let y=2029+Math.floor(m/12),mo=((3+m)%12)+1;e.insertAdjacentHTML('beforeend',`<div class="monthDivider">${y}.${String(mo).padStart(2,'0')}</div>`);groups.get(m).sort((a,b)=>b.w-a.w).forEach(p=>{e.insertAdjacentHTML('beforeend',cardHTML(p,0));replies.filter(r=>r.parent===p.id&&(r.m<monthIndex()||(r.m===monthIndex()&&r.w<=S.week))).forEach(r=>e.insertAdjacentHTML('beforeend',cardHTML(r,1)))})})}
function findPost(id){return [...P,...replies,currentPosts()].find(x=>x.id===id)}
function act(id,a){const p=findPost(id);if(!p)return;if(a==='like'){S.likes[id]=!S.likes[id];toast(S.likes[id]?'関心を記録':'関心を解除')}if(a==='book'){S.books[id]=!S.books[id];if(S.books[id]&&researchMap[id]&&!S.research.some(x=>x.id===id)){let q=researchMap[id];S.research.push({id,title:q.title,result:q.result,due:monthIndex()+q.delay,done:false,topic:p.topic});toast(`${q.title} を調査登録`)}else if(S.books[id]&&!researchMap[id])toast('観測を保存。現デモでは自動調査対象外');else if(!S.books[id])toast('調査登録を解除')}if(a==='follow'){S.follow[p.who]=!S.follow[p.who];toast(S.follow[p.who]?'継続観測に追加':'フォロー解除')}if(a==='detail'){openSheet(`<div class="meta">${p.meta}</div><h2>${p.who}</h2><p>${p.text}</p><p>同テーマの観測は現在 ${relCount(p.topic)+1}件。FEED上の声は「事実そのもの」ではなく、立場・経験・観測範囲を持つ情報として扱います。</p>`)}renderFeed()}
function openSheet(h){document.getElementById('sheetBody').innerHTML=h;document.getElementById('ov').classList.add('on')}function closeSheet(){document.getElementById('ov').classList.remove('on')}
function updateTop(){document.getElementById('cp').textContent=S.pop.toLocaleString();document.getElementById('cl').textContent=S.life;document.getElementById('cf').textContent=S.fisc;document.getElementById('ct').textContent=S.trust;document.getElementById('bottomYm').textContent=ym();document.getElementById('bottomMn').textContent=`第${S.week}週`}
function drift(scale=.25){let r=()=>Math.round((Math.random()-.5)*2*scale);S.life=Math.max(0,Math.min(100,S.life+r()+Math.round((S.values.life-60)/80*scale)));S.fisc=Math.max(0,Math.min(100,S.fisc+r()-Math.round((S.values.life+S.values.future-120)/130*scale)));S.trust=Math.max(0,Math.min(100,S.trust+r()+Math.round((S.resilience-55)/120*scale)));S.resilience=Math.max(0,Math.min(100,S.resilience+r()+Math.round((S.values.future+S.values.env-120)/100*scale)));S.pop=Math.round(S.pop+((S.life+S.activity-135)/140)*scale+r())}
function advanceWeek(){S.week++;if(S.week>4){openMeeting();return}else{drift(.25);updateTop();renderFeed();toast(`第${S.week}週へ`)}}
function toMonthEnd(){if(S.week<4){while(S.week<4){S.week++;drift(.25)}updateTop();renderFeed()}openMeeting()}
function summarizeMonth(){const topics={};currentPosts().filter(p=>p.m===monthIndex()).forEach(p=>topics[p.topic]=(topics[p.topic]||0)+1);let top=Object.entries(topics).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);const names={transport:'交通',medical:'医療アクセス',flood:'冠水・排水',sumo:'八朔相撲',wildlife:'野生動物',population:'人口移動',finance:'維持費',school:'公共施設',rain:'豪雨',ditch:'維持管理',commerce:'商業'};return top.map(x=>names[x]||x).join(' / ')||'大きな偏りなし'}
function openMeeting(){const key=`${S.year}-${S.month}`;if(S.meetingDone[key]){nextMonth();return}document.getElementById('meetTitle').textContent=`${ym()} 月例報告会`;const focus=summarizeMonth();const research=S.research.filter(r=>r.done).slice(-2);document.getElementById('meetingBody').innerHTML=`<div class="meetingContext"><div class="eyebrow">今月の主要観測</div><div class="topic">${focus}</div><p>FEED上の声、返信、調査結果、状態変化を突き合わせます。多数派の意見をそのまま採用する会議ではありません。</p></div><div class="meetingThread"><div class="bubble"><div class="avatar">運</div><div class="speech"><div class="speaker">実証運営 <span class="role">河北恒研</span></div>今月は「${focus}」への投稿が増えました。単一の原因と決めず、関連する観測を来月も残します。</div></div><div class="bubble"><div class="avatar">調</div><div class="speech"><div class="speaker">調査担当 <span class="role">河北恒研</span></div>${research.length?research.map(r=>`「${r.title}」は報告済み。`).join(' '):'今月完了した調査はありません。気になる投稿から調査を登録できます。'}</div></div><div class="bubble"><div class="avatar">◇</div><div class="speech hms"><div class="speaker">ADHOMS <span class="role">SYSTEM</span></div>現在の重点は「問題を消すこと」ではなく、変化に対して地域機能がどこで失われるかを観測することです。来月の価値優先度を確認してください。</div></div></div><div class="monthlyValues"><b>VALUE PRIORITIES</b><label>暮らし<input type="range" min="20" max="100" value="${S.values.life}" data-k="life"><span>${S.values.life}</span></label><label>活力<input type="range" min="20" max="100" value="${S.values.vital}" data-k="vital"><span>${S.values.vital}</span></label><label>未来<input type="range" min="20" max="100" value="${S.values.future}" data-k="future"><span>${S.values.future}</span></label><label>技術<input type="range" min="20" max="100" value="${S.values.tech}" data-k="tech"><span>${S.values.tech}</span></label><label>環境<input type="range" min="20" max="100" value="${S.values.env}" data-k="env"><span>${S.values.env}</span></label></div><button class="meetingContinue" onclick="finishMeeting('${key}')">設定を保存して翌月へ →</button>`;document.querySelectorAll('.monthlyValues input').forEach(x=>x.oninput=()=>x.nextElementSibling.textContent=x.value);document.getElementById('meeting').classList.add('on')}
function finishMeeting(key){document.querySelectorAll('.monthlyValues input').forEach(x=>S.values[x.dataset.k]=+x.value);S.meetingDone[key]=true;document.getElementById('meeting').classList.remove('on');nextMonth()}
function nextMonth(){S.week=1;S.month++;if(S.month>12){S.month=1;S.year++}if(S.year>5){showEnding();S.year=5;S.month=12;S.week=4;return}drift(1);if(S.month===1||S.month===2)S.fisc=Math.max(0,S.fisc-1);updateTop();renderFeed();setTimeout(()=>window.scrollTo({top:Math.max(0,document.querySelector('main').offsetTop-document.querySelector('header').getBoundingClientRect().height),behavior:'smooth'}),50);toast(`${ym()} のFEEDを受信`)}

document.getElementById('nextWeek').onclick=advanceWeek;document.getElementById('toMonthEnd').onclick=toMonthEnd;document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};renderFilters();updateTop();renderFeed();

        who.innerHTML = `${post.who}${badges}`;
      }
      let profile = card.querySelector('.profileLine');
      if (!profile) {
        profile = document.createElement('div');
        profile.className = 'profileLine';

        meta?.before(profile);
      }
      if (profile) profile.textContent = post.profile || '年齢不詳 / 立場確認中';
    });
  };

  renderFeed();
})();

    return out;

    if(Math.floor(absMonth()/12)+1===1){

    }
    historyContextRows(idx).forEach(beat=>rows.push(beat));
    researchRows(idx).forEach(beat=>rows.push(beat));
    // Append to the seed array so existing scenario-* IDs never shift. The
    // display order puts this first-day conversation before resident cards.
    if(idx===0)rows.push(...onboarding);
    rows.forEach((r,i)=>{

(() => {
  const clamp = (n, min = 0, max = 4) => Math.max(min, Math.min(max, n));
  const LEVELS = ['very_low', 'low', 'mid', 'high', 'very_high'];

  const createInitialState = () => ({
    year: 1,
    month: 4,
    town: {
      trust: 2,
      legitimacy: 2,
      responseReadiness: 2,
      networkResilience: 2,
      distributedCapacity: 1,
      environmentalBuffer: 2,
    },

      station_lowland: { localTrust: 2, burdenMemory: 0, tags: ['flood_prone'] },
      old_road: { localTrust: 2, burdenMemory: 0, tags: ['elderly', 'festival'] },
      hillside_hub: { localTrust: 2, burdenMemory: 0, tags: ['high_ground', 'industry'] },
      forest_park: { localTrust: 2, burdenMemory: 0, tags: ['tourism', 'forest'] },
    },
    relations: {
      gas_station: 0,
      warehouse: 0,
      technical_lab: 1,
      school: 0,
      childcare: 0,
      factory_logistics: 0,
      brine: 0,
      miso_shop: 0,
    },
    memories: [],
    flags: {},
    disaster: {
      evacuationDelayMin: null,
      routeLifetimeMin: {},
      shelterCapacity: {},
      logisticsHours: null,
    },
  });

  function applyDelta(state, delta = {}) {
    const next = structuredClone(state);
    if (delta.town) {
      for (const [k, v] of Object.entries(delta.town)) {
        next.town[k] = clamp((next.town[k] ?? 2) + v);
      }
    }
    if (delta.districts) {
      for (const [id, d] of Object.entries(delta.districts)) {
        next.districts[id] ??= { localTrust: 2, burdenMemory: 0, tags: [] };
        if (typeof d.localTrust === 'number') {
          next.districts[id].localTrust = clamp(next.districts[id].localTrust + d.localTrust);
        }
        if (typeof d.burdenMemory === 'number') {
          next.districts[id].burdenMemory = clamp(next.districts[id].burdenMemory + d.burdenMemory);
        }
      }
    }
    if (delta.relations) {
      for (const [k, v] of Object.entries(delta.relations)) {
        next.relations[k] = clamp((next.relations[k] ?? 0) + v);
      }
    }
    if (delta.flags) Object.assign(next.flags, delta.flags);
    return next;
  }

  function addMemory(state, memory) {
    const next = structuredClone(state);
    next.memories.push({
      id: memory.id,
      year: state.year,
      month: state.month,
      valence: memory.valence ?? 0,
      scope: memory.scope ?? 'town',
      tags: memory.tags ?? [],
      note: memory.note ?? '',
    });
    return next;
  }

  function level(value) {
    return LEVELS[clamp(value)];
  }

  window.ADHOMS_VER1_STATE = {
    LEVELS,
    createInitialState,
    applyDelta,
    addMemory,
    level,
  };
})();

(() => {
  function score(state) {
    const t = state.town;
    const avgRelation = Object.values(state.relations).reduce((a, b) => a + b, 0) /
      Math.max(1, Object.keys(state.relations).length);

    return {
      warningConversion: t.trust + t.legitimacy + t.responseReadiness,
      mobility: t.networkResilience + avgRelation,
      reconfiguration: t.distributedCapacity + avgRelation,
      floodBuffer: t.environmentalBuffer + t.networkResilience,
    };
  }

  function deriveDisasterState(state) {
    const s = score(state);
    return {
      evacuationDelayMin: Math.max(5, 50 - s.warningConversion * 4),
      logisticsHours: Math.max(2, Math.round(3 + s.reconfiguration * 1.5)),
      routeLifetimeMin: {
        station_route: Math.max(8, Math.round(10 + s.mobility * 3)),
        forest_route: Math.max(8, Math.round(8 + s.floodBuffer * 3)),
        festival_route: Math.max(8, Math.round(9 + s.mobility * 2.5)),
      },
      shelterCapacity: {
        fixed: 100 + Math.round(state.town.distributedCapacity * 25),
        portable: Math.round(state.town.distributedCapacity * 40),
      },
    };
  }

  function availableEmergencyCommands(state) {
    const out = ['issue_warning', 'close_route', 'reassign_buses'];
    if (state.relations.gas_station >= 2) out.push('priority_fuel');
    if (state.relations.warehouse >= 2) out.push('open_warehouse');

    if (state.town.distributedCapacity >= 2) out.push('deploy_mobile_command');
    if (state.town.distributedCapacity >= 3) out.push('deploy_portable_shelter');
    return out;
  }

  window.ADHOMS_VER1_DISASTER = {
    score,
    deriveDisasterState,

  };
})();

(() => {
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  function run() {
    const S = window.ADHOMS_VER1_STATE;
    const E = window.ADHOMS_VER1_EVENTS;
    const P = window.ADHOMS_VER1_PROPAGATION;
    const F = window.ADHOMS_VER1_FINAL;

    let state = S.createInitialState();
    state.year = 2;
    state = E.resolveChoice(state, 'y2_snow', 'welfare_first');
    state = E.resolveChoice(state, 'y2_flood', 'guided_watch');
    state = E.resolveChoice(state, 'y2_wildlife', 'survey');

    state.year = 3;
    const propagated = P.applySideEffects(state);
    state = propagated.state;
    assert(propagated.applied.length >= 3, 'Year 3 side effects did not resolve.');

    state.year = 4;
    const y4 = P.resolveYear4Strategy(state, 'deepen');
    state = y4.state;
    assert(state.town.distributedCapacity >= 2, 'Year 4 did not increase distributed capacity.');

    state.year = 5;
    let session = F.createSession(state);
    session = F.applyDecision(session, 'sumo_schedule', 'advance');
    session = F.applyDecision(session, 'towa_schedule', 'advance');
    session = F.applyDecision(
      session,
      'portable_shelter',
      F.availableChoices(session, 'portable_shelter').includes('full') ? 'full' : 'none'
    );
    session = F.applyDecision(
      session,
      'mobile_command',
      F.availableChoices(session, 'mobile_command').includes('deploy_highground') ? 'deploy_highground' : 'standby'
    );

    while (session.phaseIndex < F.PHASES.length - 1) {
      session = F.nextPhase(session);
    }

    session = F.finalize(session);
    assert(session.result, 'Final result missing.');
    assert(Number.isFinite(session.result.humanSafety), 'Human safety score invalid.');

    return {
      appliedSideEffects: propagated.applied.map((x) => x.id),
      offers: y4.offers.map((x) => x.id),
      resistance: y4.resistance.map((x) => x.id),
      result: session.result,
    };
  }

  document.addEventListener('toggle',()=>queueMicrotask(save),true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
  const reset=window.ADHOMS_VER1_DEBUG.reset;
  window.ADHOMS_VER1_DEBUG.reset=()=>{resetting=true;localStorage.removeItem(KEY);reset();};
})();
